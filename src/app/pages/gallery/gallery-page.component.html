<div class="gallery-page-container">
    <div class="header-container">
        <div class="photo-header" [style.backgroundImage]="'url(' + bannerImage + ')'"></div>
        <div class="servizi-header">{{ servizioName }}</div>
    </div>
    
    <div class="gallery-content">
        <div *ngIf="photos.length > 0" class="gallery-grid">
            <div *ngFor="let photo of photos" class="polaroid-item">
                <div class="polaroid-frame">
                    <img [src]="photo.src" [alt]="photo.alt" loading="lazy">
                    <div class="polaroid-text">{{ photo.nome }}</div>
                </div>
            </div>
        </div>
        <div *ngIf="photos.length === 0" class="no-photos">
            <p>Gallery non disponibile per questo servizio</p>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-back" (click)="goBack()">Torna indietro</button>
        <a [routerLink]="['/contatti']" class="btn-contact">Contattami</a>
    </div>
</div>
