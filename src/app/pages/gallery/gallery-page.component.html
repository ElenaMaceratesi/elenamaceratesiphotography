<div class="gallery-page-container">
    <div class="header">
        <h1>{{ servizioName }}</h1>
    </div>
    
    <div class="gallery-content">
        <div *ngIf="photos.length > 0" class="gallery-grid">
            <div *ngFor="let photo of photos" class="gallery-item">
                <img [src]="photo.src" [alt]="photo.alt" loading="lazy">
            </div>
        </div>
        <div *ngIf="photos.length === 0" class="no-photos">
            <p>Gallery non disponibile per questo servizio</p>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-back" (click)="goBack()">Torna indietro</button>
        <a [routerLink]="['/contatti']" class="btn-contact">Contattami</a>
    </div>
</div>
