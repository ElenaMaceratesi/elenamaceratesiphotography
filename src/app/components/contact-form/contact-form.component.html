<section class="contact-form">
  <h2>Contattami</h2>

  <form>
    <input
      type="text"
      placeholder="Nome"
      [(ngModel)]="formData.name"
      name="name"
    />

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="formData.email"
      name="email"
    />

    <textarea
      rows="5"
      placeholder="Messaggio"
      [(ngModel)]="formData.message"
      name="message"
    ></textarea>

    <!-- AIUTO EMAIL -->
    <p class="helper-text">
      ✉️ Compila <strong>nome, email e messaggio</strong> per inviare una mail.
    </p>

    <button
      type="submit"
      (click)="submitForm()"
      [disabled]="!isEmailFormValid"
    >
      Invia
    </button>

    <!-- AIUTO WHATSAPP -->
    <p class="helper-text">
      💬 Se preferisci, puoi scrivermi su WhatsApp compilando solo il messaggio.
    </p>

    <button
      type="button"
      (click)="sendOnWhatsapp()"
      [disabled]="!isWhatsappValid"
      class="whatsapp-btn"
    >
      Invia su WhatsApp
    </button>
  </form>
</section>
