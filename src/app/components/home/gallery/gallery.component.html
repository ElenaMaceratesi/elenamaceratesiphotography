<!-- carousel.component.html -->
<section class="carousel-section">
    <div class="carousel-container">
        <div #carouselTrack (transitionend)="onTransitionEnd()">
            <div class="carousel-item">
                <img [src]="images[currentIndex]" alt="Immagine del carosello">
            </div>
        </div>
        <button class="carousel-button prev" (click)="prev()">‹</button>
        <button class="carousel-button next" (click)="next()">›</button>

        <!-- Indicatori -->
        <div class="carousel-indicators">
            <button
                    *ngFor="let image of images; let i = index"
                    class="indicator"
                    [class.active]="i === currentIndex"
                    (click)="goToSlide(i)">
            </button>
        </div>
    </div>
    <div class="text">
        <p class="gallery-text">Se ti emoziona, sei nel posto giusto.</p>
    </div>
</section>
